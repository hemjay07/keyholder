<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Keyholder Stage map</title>
<style>
  html,body,#root{margin:0;height:100%;background:#0d0c0a;color:#e9e4d8;font:14px/1.4 ui-monospace,monospace}
  #root{width:100%;height:100%}
  .legend{position:absolute;left:16px;top:16px;font-size:12px;pointer-events:none}
  .legend .row{margin:0 0 6px;letter-spacing:.04em}
  .legend .row>span:first-child{text-transform:uppercase;display:inline-block;min-width:150px}
  .legend .top{opacity:.8}
  @media (max-width:600px){.legend .top{display:none}.legend .row>span:first-child{min-width:0}}
  .card{position:absolute;right:16px;bottom:64px;background:#1a1814;border:1px solid #3a352c;padding:10px 12px;max-width:300px;font-size:12px}
  .card .id{opacity:.5;font-size:10px;word-break:break-all;margin-top:4px}
  h1{position:absolute;left:16px;right:16px;bottom:12px;margin:0;font-size:18px;font-weight:400}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
