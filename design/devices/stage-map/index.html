<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Keyholder Stage map</title>
<link rel="icon" href="/mark.svg" />
<link rel="stylesheet" href="/fonts/Geist.css" />
<style>
  @font-face{font-family:"Geist Mono";src:url(/fonts/GeistMono-Regular.woff2) format("woff2");font-display:swap}
  :root{--bg:#E6E2D9;--panel:#F4F1EA;--ink:#1B1A17;--ink-2:#5A564E;--signal:#FF5A1F;--signal-text:#A32F06;--hair:rgba(27,26,23,.14)}
  html,body,#root{margin:0;background:var(--bg);color:var(--ink)}
  body{font:13px/1.45 "Geist Mono",monospace}
  html,body{height:auto}
  .stage{position:relative;padding:28px 40px 20px;box-sizing:border-box}
  .scrolly{height:500vh;margin:0 -40px}
  .scrolly .map{position:sticky;top:0;height:100vh}
  .caption{position:absolute;left:40px;bottom:40px;max-width:420px;background:var(--panel);border:1px solid var(--hair);padding:14px 16px;pointer-events:none}
  .caption b{display:block;font:500 20px/1.2 Geist,sans-serif;margin-bottom:6px}
  .caption span{color:var(--ink-2)}
  @media (prefers-reduced-motion:reduce){.scrolly{height:auto}.scrolly .map{position:relative;height:70vh}}
  header h1{font:500 46px/1.08 Geist,sans-serif;letter-spacing:-.02em;margin:0;max-width:22ch}
  header .num{color:var(--signal-text);font-variant-numeric:tabular-nums}
  header .sub{color:var(--ink-2);margin:12px 0 0}
  .legend{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:0;border-top:1px solid var(--hair);padding-top:12px}
  .legend dt{display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
  .legend dt b{font-weight:400;margin-left:auto;font-variant-numeric:tabular-nums}
  .legend dd{margin:4px 0 0 16px;color:var(--ink-2);font-size:11px}
  .legend i{width:8px;height:8px;display:inline-block}
  .legend i.pulse{background:var(--signal);animation:p 1.6s ease-in-out infinite}
  @keyframes p{50%{opacity:.35}}
  .card{position:absolute;right:40px;top:150px;background:var(--panel);border:1px solid var(--hair);padding:10px 12px;max-width:300px}
  .card .nm{font:500 15px Geist,sans-serif}
  .card .id{color:var(--ink-2);font-size:10px;word-break:break-all;margin-top:4px}
  .card .warn{color:var(--signal-text);margin-top:4px}
  .picked{position:fixed;top:24px;right:24px;width:300px;max-height:calc(100vh - 48px);overflow:auto;z-index:2}
  .picked .nm{max-width:calc(100% - 32px)}
  header .sub{max-width:62ch}
  .picked button{position:absolute;right:8px;top:4px;border:0;background:none;font:20px Geist,sans-serif;cursor:pointer;color:var(--ink-2)}
  .picked .why{margin:8px 0;color:var(--ink)}
  .picked .why span{color:var(--ink-2)}
  .picked dt.h{grid-column:1/-1;text-transform:uppercase;letter-spacing:.06em;font-size:10px;margin-top:4px}
  .picked dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 6px;font-size:11px}
  .picked dt{color:var(--ink-2)}
  .picked dd{margin:0}
  .picked .keys{word-break:break-word}
  @media (max-width:600px){
    .stage{padding:20px 16px 16px}
    .scrolly{margin:0 -16px}
    .caption{left:16px;right:16px;bottom:16px}
    header h1{font-size:30px}
    .legend{grid-template-columns:1fr 1fr;gap:10px}
    .legend dd{display:none}
    .card{left:16px;right:16px;top:auto;bottom:16px}
    .picked{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:55vh;max-width:none;border-width:1px 0 0;box-sizing:border-box}
  }
  @media (prefers-reduced-motion:reduce){.legend i.pulse{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
