# design/surfaces.yaml -- one entry per BUILT route, with a real sample path for dynamic routes.
# headline: the one line the surface exists to say; it must be the largest text.
# Routes asked for but not built yet (/events/[uid], /alerts, /proof, /policy) are in SCOPE.md
# and are added here the turn they are built.
surfaces:
  - route: /
    name: home
    headline: "Drift needed two keys to lose $285M."
  - route: /protocols/drift
    name: protocol-drift
    headline: "Drift Protocol: 4 of 7 keys, 1 h timelock"
  - route: /protocols/marinade
    name: protocol-marinade
    headline: "Marinade: 6 of 13 keys, no timelock feature"
  - route: /feed
    name: feed
    headline: "Every control change on Solana, as it lands."
  - route: /replay/drift
    name: replay
    headline: "5.6 days of warning."
  - route: /wallet
    name: wallet
    headline: "Who can move your money?"
  - route: /proof
    name: proof
    headline: "Refused on-chain."
