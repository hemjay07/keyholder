# design/surfaces.yaml -- one entry per route. headline: the one line the surface exists to say;
# it must be the largest text once allow_larger is set aside.
surfaces:
  - route: /
    name: home
    headline: "Drift needed two keys to lose $285M."
  - route: /protocols/[slug]
    name: protocol
    headline: "<Protocol>: <M> of <N> keys, <timelock>"
  - route: /events/[uid]
    name: event
    headline: "<what changed, in one sentence>"
  - route: /feed
    name: feed
    headline: "Every control change on Solana, as it lands."
  - route: /replay/drift
    name: replay
    headline: "1.55 days of warning."
  - route: /wallet
    name: wallet
    headline: "Who can move your money?"
  - route: /alerts
    name: alerts
    headline: "Get told the moment control weakens."
  - route: /proof
    name: proof
    headline: "Refused on-chain."
  - route: /policy
    name: policy
    headline: "Refuse deposits where control just weakened."
