source: "BRIEF.md (2026-09-25, Solana track, Colosseum Crypto World's Fair)"
demand: D0
demand_evidence: |
  18 first-person posts by Solana developers and traders 2026-04-01 to 2026-09-25 citing upgrade-authority/timelock risk in the wake of Drift Protocol's $285.26M loss (BRIEF §3 item 3; sources research/12-demand-grok-round2.md Q4):
  @mubaraqabba (2026-04-02) "That single key can replace the program bytecode with anything"
  @rami_poker "Raydium's 3/4 multisig with no timelock"
  @Selas2311 asking a project for a timelock timeline
  13 more in 10-day windows post-Drift (research/12-demand-grok-round2.md full list).
  D0 rationale: no post asked for this product by name, but the signal is unambiguous and latent (per BRIEF §3 item 3: "Grok stated: 'there is still no widely cited subscribe to these program IDs and email me a verified-build diff when last_deploy_slot moves product'").

company_case: 'weak: payers exist by construction but none has committed. Candidates: wallet teams (a control-change warning beside simulation; Blowfish-class vendor is defunct), vault curators and integrators on Kamino/marginfi-style markets (per-dependency feed), risk desks and funds (API + historical control state), agents (x402 per call). Prices are ASSUMPTIONS ($199–999/month tiers; $0.01–0.10 per call) anchored on Helius $49/$499/$999 plans (BACKEND §2). No payer has been contacted; the founder has no access to protocol teams, so traction must come from the public product itself.'
company_evidence: |
  Drift, 2026-04-01, $285.26M (rekt.news/drift-protocol-rekt, fetched 2026-09-25): admin taken via a 2-of-5 multisig with zero timelock; four durable nonces created 2026-03-23; a Security Council migration lowered the threshold 3-of-5 to 2-of-5; malicious collateral market; 18 vaults drained in 128 seconds.
  Verified-build status of 15 major programs (verify.osec.io/status, 2026-09-26): verified: Kamino Lend, marginfi v2, Phoenix; registered but no longer matching: Raydium AMM v4, Raydium CLMM, Orca Whirlpool, Drift v2, Marinade, Squads v4; never registered: Jupiter v6, Meteora DLMM, Jito stake pool, Pump.fun, Openbook v2, Sanctum router.
  No rekt.news Solana entry names a malicious program upgrade as the vector; the named vectors are admin keys and multisigs.
  Closest tools (BRIEF): Solana Foundation Microscope (self-hosted, one program + one Squads multisig per deployment); Sec3 free nonce/multisig monitor (own team); UpgradeGuard / solana-upgrade-guard (pre-deploy CLIs); Phantom (simulation + scam lists only); Solscan shows "MULTISIG" and "verified FALSE" but no threshold, timelock or history (plan/research/refs/18).
  This is evidence of the problem and the gap, not of a paying customer; hence company_case weak.

weak_case_accepted: 'founder in chat, 2026-09-26, after reading PLAN.md and the weak-demand line: "go ahead"'

