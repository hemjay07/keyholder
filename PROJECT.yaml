  - Triton Yellowstone: ~$25/mo (bandwidth only; $125 deposit covers it)
  - Neon Postgres: ~$19/mo (Launch plan)
  - Fly.io worker: ~$15/mo (shared-cpu-2x)
  - Vercel: free (Hobby tier) / $20/mo (Pro)
  - Upstash Redis (rate limits): free tier ~$0
  - Resend email: free tier (100/day)
  - X API: $0 (manual posts) or $100/mo (Essential plan; demo can skip)
  - PayAI x402: free tier or devnet
  Total: $59–179/mo. Caps at $150; founder alerted if >$120.

