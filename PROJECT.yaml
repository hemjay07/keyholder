gate_0: "yes, Keyholder (founder, 2026-09-26, from research/13-ranking-round2.md gate question and BRIEF acceptance)"

data_policy: |
  Real events only; no mock data or mock payments in any demo path.
  - Events are real on-chain transactions, indexed live from Yellowstone (Triton) or RPC.
  - Metrics reported in submission (protocol count, event count, verified builds) are measured from live chain state, not invented.
  - Drift replay is reconstructed from real March–April 2026 transactions; labeled as such.
  - x402 payments are real USDC on mainnet (or devnet with clear labeling if mainnet not ready); never mocked.
  - Telegram subscribers are organic; no fake test accounts.
  - Wallet positions are resolved live from SPL Token + program accounts; never fabricated.

phase_workflow:
  - "SELECT: demand (D0) + company case (viable) + data policy (real events) gates cleared. No build starts without these."
  - "PLAN mode: this document and PLAN.md (strategy, decisions, schedule, risks)."
  - "BUILD: critical path ingest → decode → state → risk → replay (days 1–7). UI (SURFACE kit) parallel from day 4."
  - "SHIP: day 16 freeze; demo video + presentation video + submission form by 2026-10-13T06:59:59Z."
  - "LEARN: postmortem after submission (incidents.md, lessons.md, SOP fixes)."

